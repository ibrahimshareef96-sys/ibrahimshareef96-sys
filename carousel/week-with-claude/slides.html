<!doctype html>
<html lang="en" data-theme="claude">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My week with Claude</title>
<style>
@font-face { font-family: 'Source Serif 4'; src: url(fonts/source-serif-4-latin-opsz-normal.woff2) format('woff2-variations'); font-weight: 200 900; font-style: normal; }
@font-face { font-family: 'Source Serif 4'; src: url(fonts/source-serif-4-latin-opsz-italic.woff2) format('woff2-variations'); font-weight: 200 900; font-style: italic; }
@font-face { font-family: 'Poppins'; src: url(fonts/poppins-latin-400-normal.woff2) format('woff2'); font-weight: 400; }
@font-face { font-family: 'Poppins'; src: url(fonts/poppins-latin-500-normal.woff2) format('woff2'); font-weight: 500; }
@font-face { font-family: 'Poppins'; src: url(fonts/poppins-latin-600-normal.woff2) format('woff2'); font-weight: 600; }
@font-face { font-family: 'Poppins'; src: url(fonts/poppins-latin-700-normal.woff2) format('woff2'); font-weight: 700; }
@font-face { font-family: 'JetBrains Mono'; src: url(fonts/jetbrains-mono-latin-400-normal.woff2) format('woff2'); font-weight: 400; }
@font-face { font-family: 'JetBrains Mono'; src: url(fonts/jetbrains-mono-latin-500-normal.woff2) format('woff2'); font-weight: 500; }
@font-face { font-family: 'Amiri'; src: url(fonts/amiri-arabic-400-normal.woff2) format('woff2'); font-weight: 400; }

/* ---------- Theme: claude (the look of Claude's "week with Claude" campaign) ---------- */
:root, [data-theme="claude"] {
  --ink: #141413; --ink-2: #3d3d3a; --ink-3: #5e5d59;
  --clay: #d97757; --label: #9c4a30; --clay-soft: #e59a7f;
  --paper: #ffffff; --card: #faf9f5; --ivory: #f0eee6; --line: #dedcd1; --hair: rgba(20,20,19,.12);
  --band-sky: #dbe5ef; --band-clay: #f1d9cc; --band-heather: #e0dcec; --band-olive: #dfe6d3; --band-oat: #ece7da; --band-blush: #f3e3dc;
  --cover-bg: #f0eee6; --dark-bg: #141413; --dark-ink: #faf9f5; --dark-ink-2: rgba(250,249,245,.78); --dark-hair: rgba(250,249,245,.16);
  --cal-head: #d97757; --cal-head-ink: #141413; --how-bg: rgba(250,249,245,.94); --q-bg: #ffffff;
  --cta-bg: #d97757; --cta-ink: #141413; --tile-border: #141413;
  --ill-ink: #141413; --ill-ink-bg: #141413; --ill-paper: #ffffff;
  --ill-c1: #d97757; --ill-c2: #6a9bcc; --ill-c3: #788c5d; --ill-c4: #9a8fc6; --ill-c5: #d4a27f; --ill-c6: #e8e6dc;
  --ill-c1s: #f1d9cc; --ill-c3s: #dfe6d3;
}

/* ---------- Theme: itqan (Ibrahim's own brand: deep teal + lime) ---------- */
[data-theme="itqan"] {
  --ink: #f3f1ea; --ink-2: rgba(243,241,234,.84); --ink-3: rgba(243,241,234,.62);
  --clay: #d7fd64; --label: #d7fd64; --clay-soft: #d7fd64;
  --paper: #f3f1ea; --card: #10333a; --ivory: #0d282b; --line: rgba(243,241,234,.22); --hair: rgba(243,241,234,.14);
  --band-sky: #0d282b; --band-clay: #0d282b; --band-heather: #0d282b; --band-olive: #0d282b; --band-oat: #0d282b; --band-blush: #0d282b;
  --cover-bg: #0d282b; --dark-bg: #d7fd64; --dark-ink: #0d282b; --dark-ink-2: rgba(13,40,43,.8); --dark-hair: rgba(13,40,43,.18);
  --cal-head: #d7fd64; --cal-head-ink: #0d282b; --how-bg: #12373d; --q-bg: #f3f1ea;
  --cta-bg: #0d282b; --cta-ink: #d7fd64; --tile-border: #0d282b;
  --ill-ink: #0a1f22; --ill-ink-bg: #f3f1ea; --ill-paper: #f3f1ea;
  --ill-c1: #d7fd64; --ill-c2: #6fb3a6; --ill-c3: #3f7f76; --ill-c4: #9cc7bd; --ill-c5: #e6d7b0; --ill-c6: #dce6e1;
  --ill-c1s: #eefbc4; --ill-c3s: #cfe5df;
}
[data-theme="itqan"] .pill, [data-theme="itqan"] .cal, [data-theme="itqan"] .q, [data-theme="itqan"] code, [data-theme="itqan"] .tile { color: #0d282b; }
[data-theme="itqan"] .cal-n, [data-theme="itqan"] .tile-n { color: #0d282b; }
[data-theme="itqan"] .tile svg { stroke: #0d282b; }
[data-theme="itqan"] .tag { color: rgba(243,241,234,.7); }
[data-theme="itqan"] .note { background: #d7fd64; color: #0d282b; }
[data-theme="itqan"] .note svg, [data-theme="itqan"] .note .nb { stroke: #0d282b; color: #0d282b; }

/* ---------- Base ---------- */
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: #8a8986; }
.deck { display: flex; flex-direction: column; align-items: center; gap: 48px; padding: 48px; }
.deck.sheet { display: grid; grid-template-columns: repeat(4, max-content); gap: 28px; padding: 32px; background: #8a8986; width: max-content; }
.deck.sheet .slide { zoom: .25; }
.slide {
  width: 1080px; height: 1350px; position: relative; overflow: hidden; flex: none;
  background: var(--bg); color: var(--ink);
  font-family: 'Source Serif 4', Georgia, serif; font-optical-sizing: auto;
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
}
.eye { font: 600 24px/1.2 Poppins, sans-serif; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); margin: 0 0 12px; }
.foot { display: flex; justify-content: space-between; align-items: center; font: 500 22px/1 Poppins, sans-serif; color: var(--ink-3); letter-spacing: .02em; }
.foot .pg { display: flex; align-items: center; gap: 10px; font-variant-numeric: tabular-nums; }
.foot svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
svg.li { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
svg.bi { fill: currentColor; }

/* ---------- Illustration primitives ---------- */
.ill .k  { fill: none; stroke: var(--ill-ink); stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; }
.ill .kf { stroke: var(--ill-ink); stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; }
.ill .p  { fill: var(--ill-paper); stroke: var(--ill-ink); stroke-width: 7; stroke-linejoin: round; }
.ill .ink { fill: var(--ill-ink); }
.ill .kb  { fill: none; stroke: var(--ill-ink-bg); stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; }
.ill .inkb { fill: var(--ill-ink-bg); }
.ill .c1 { fill: var(--ill-c1); } .ill .c2 { fill: var(--ill-c2); } .ill .c3 { fill: var(--ill-c3); }
.ill .c4 { fill: var(--ill-c4); } .ill .c5 { fill: var(--ill-c5); } .ill .c6 { fill: var(--ill-c6); }
.ill .c1s { fill: var(--ill-c1s); } .ill .c3s { fill: var(--ill-c3s); }
.ill .t-serif { font-family: 'Source Serif 4', Georgia, serif; }
.ill .t-mono { font-family: 'JetBrains Mono', monospace; }

/* ---------- Day slide ---------- */
.day { --bg: var(--band); display: flex; flex-direction: column; gap: 30px; padding: 80px 88px 54px; }
.day > :not(.art) { flex-shrink: 0; }
.day-head { display: flex; gap: 36px; align-items: center; }
.cal { flex: none; width: 150px; border-radius: 24px; overflow: hidden; background: var(--paper); box-shadow: 0 0 0 2px var(--hair); text-align: center; }
.cal-d { display: block; background: var(--cal-head); color: var(--cal-head-ink); font: 700 23px/1 Poppins, sans-serif; letter-spacing: .16em; padding: 14px 0 12px .16em; }
.cal-n { display: block; font-size: 76px; line-height: 1; padding: 16px 0 22px; font-variant-numeric: tabular-nums; color: var(--ink); }
.title { font-weight: 400; font-size: 80px; line-height: 1.02; letter-spacing: -.018em; margin: 0; text-wrap: balance; }
.art { flex: 1 1 auto; min-height: 0; margin: 0 -20px; display: flex; align-items: center; justify-content: center; }
.art .ill { width: 100%; height: 100%; max-height: 470px; overflow: visible; }
.body { margin: 0; font-size: 38px; line-height: 1.38; color: var(--ink-2); text-wrap: pretty; }
.note { background: var(--dark-bg); color: var(--dark-ink); border-radius: 26px; padding: 26px 32px 28px; display: grid; grid-template-columns: 42px 1fr; gap: 22px; align-items: start; font-size: 31px; line-height: 1.38; }
.note svg { width: 42px; height: 42px; stroke: var(--clay-soft); margin-top: 2px; }
.nb { display: block; font: 700 21px/1 Poppins, sans-serif; letter-spacing: .14em; text-transform: uppercase; color: var(--clay-soft); margin: 6px 0 12px; }
.pull { margin: 0; font-style: italic; font-size: 42px; line-height: 1.24; color: var(--label); }
.how { background: var(--how-bg); border-radius: 28px; overflow: hidden; box-shadow: 0 0 0 2px var(--hair); }
.sec { padding: 24px 32px 26px; }
.sec + .sec { border-top: 2px solid var(--hair); }
.lbl { font: 700 21px/1 Poppins, sans-serif; letter-spacing: .14em; text-transform: uppercase; color: var(--label); margin: 0 0 16px; }
.run { display: flex; flex-wrap: wrap; align-items: center; gap: 16px 30px; }
.run > div { display: flex; align-items: center; gap: 14px; }
.tag { font: 600 20px/1 Poppins, sans-serif; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); white-space: nowrap; }
.q { background: var(--q-bg); color: var(--ink); border-radius: 30px 30px 30px 8px; padding: 12px 24px 14px; font-size: 32px; line-height: 1.25; box-shadow: 0 0 0 2px var(--hair); }
code { font: 500 27px/1.2 'JetBrains Mono', monospace; background: var(--paper); color: var(--ink); border: 2px solid var(--line); border-radius: 12px; padding: 8px 14px; }
.pills { display: flex; flex-wrap: wrap; gap: 12px; }
.pill { display: inline-flex; align-items: center; gap: 10px; background: var(--paper); color: var(--ink); border: 2px solid var(--line); border-radius: 999px; padding: 9px 20px 9px 14px; font: 500 23px/1 Poppins, sans-serif; white-space: nowrap; }
.pill svg { width: 26px; height: 26px; flex: none; }
.fine { margin: -12px 0 0; font: 400 21px/1.35 Poppins, sans-serif; color: var(--ink-3); }

/* ---------- Cover ---------- */
.cover { --bg: var(--cover-bg); display: flex; flex-direction: column; padding: 84px 88px 54px; }
.cover .eye { margin-bottom: 30px; }
.cover-title { font-weight: 400; font-size: 150px; line-height: .98; letter-spacing: -.03em; margin: 0; }
.cover-title em { font-style: italic; letter-spacing: -.02em; }
.cover-sub { font-size: 40px; line-height: 1.3; color: var(--ink-2); margin: 30px 0 0; max-width: 820px; text-wrap: balance; }
.tiles { margin: auto 0 0; display: grid; grid-template-columns: repeat(4, 1fr); gap: 44px 36px; padding: 0 8px 26px 0; }
.tile { background: var(--paper); border: 3.5px solid var(--tile-border); border-radius: 24px; overflow: hidden; box-shadow: 13px 13px 0 var(--shadow); transform: rotate(var(--r)); }
.tile-d { display: block; background: var(--cal-head); color: var(--cal-head-ink); border-bottom: 3.5px solid var(--tile-border); font: 700 22px/1 Poppins, sans-serif; letter-spacing: .16em; text-align: center; padding: 14px 0 12px .16em; }
.tile-b { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; height: 158px; }
.tile svg { width: 70px; height: 70px; stroke: var(--ink); stroke-width: 1.6; }
.tile-n { font: 500 20px/1 Poppins, sans-serif; color: var(--ink-3); letter-spacing: .08em; }
.cover .foot { margin-top: 36px; }

/* ---------- Overview ---------- */
.overview { --bg: var(--ivory); display: flex; flex-direction: column; padding: 80px 88px 54px; }
.ov-title { font-weight: 400; font-size: 78px; line-height: 1.02; letter-spacing: -.02em; margin: 0 0 40px; }
.ov-list { list-style: none; margin: 0 0 auto; padding: 38px 40px 38px 44px; border-radius: 32px; background: var(--card); box-shadow: 0 0 0 2px var(--hair); }
.ov-list li { position: relative; display: grid; grid-template-columns: 236px 1fr; gap: 20px; padding: 0 0 33px 42px; }
.ov-list li::before { content: ""; position: absolute; left: 0; top: 12px; width: 18px; height: 18px; border-radius: 50%; background: var(--clay); }
.ov-list li::after { content: ""; position: absolute; left: 8px; top: 38px; bottom: 4px; width: 2px; background: var(--ink); opacity: .2; }
.ov-list li:last-child { padding-bottom: 0; }
.ov-list li:last-child::after { display: none; }
.ov-when { font: 600 22px/1.3 Poppins, sans-serif; color: var(--ink-3); padding-top: 10px; }
.ov-t { font-size: 38px; line-height: 1.15; font-weight: 500; }
.ov-w { font-size: 28px; line-height: 1.3; color: var(--ink-2); margin-top: 5px; }
.overview .foot { margin-top: 36px; }

/* ---------- Closing ---------- */
.closing { --bg: var(--dark-bg); color: var(--dark-ink); display: flex; flex-direction: column; padding: 84px 88px 54px; }
.cl-top { display: flex; align-items: center; gap: 18px; }
.cl-top svg { width: 58px; height: 58px; stroke: var(--clay-soft); stroke-width: 1.8; }
.cl-top .nb { margin: 0; font-size: 24px; }
.cl-title { font-weight: 400; font-size: 150px; line-height: .98; letter-spacing: -.03em; margin: 72px 0 0; }
.cl-body { font-size: 42px; line-height: 1.38; color: var(--dark-ink-2); margin: 40px 0 0; max-width: 860px; text-wrap: pretty; }
.itqan { margin-top: auto; display: flex; align-items: center; gap: 40px; padding: 34px 0; border-top: 2px solid var(--dark-hair); border-bottom: 2px solid var(--dark-hair); }
.ar { font-family: 'Amiri', serif; font-size: 116px; line-height: 1.1; color: var(--clay-soft); flex: none; }
.itqan-en { font-size: 33px; line-height: 1.35; font-style: italic; color: var(--dark-ink-2); }
.cta { display: flex; align-items: center; flex-wrap: wrap; gap: 18px 22px; margin: 40px 0 42px; }
.cta-pill { background: var(--cta-bg); color: var(--cta-ink); font: 600 30px/1 Poppins, sans-serif; padding: 20px 30px 19px; border-radius: 999px; }
.cta-text { font-size: 35px; }
.closing .foot { color: var(--dark-ink-2); opacity: .8; }
[data-theme="itqan"] .closing .ar, [data-theme="itqan"] .closing .nb, [data-theme="itqan"] .cl-top svg { color: #0d282b; stroke: #0d282b; }
</style>
</head>
<body>
<!-- Shared hand-drawn wobble. Kept renderable (not display:none) so url(#rough) resolves. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="rough" x="-4%" y="-4%" width="108%" height="108%">
    <feTurbulence type="fractalNoise" baseFrequency="0.013" numOctaves="1" seed="11" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="4" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>
<main class="deck" id="deck"></main>
<script src="icons.js"></script>
<script src="illustrations.js"></script>
<script src="content.js"></script>
<script>
(function () {
  const params = new URLSearchParams(location.search);
  if (params.get('theme')) document.documentElement.dataset.theme = params.get('theme');
  if (params.get('sheet')) document.getElementById('deck').classList.add('sheet');

  const I = window.ICONS, S = window.SLIDES, total = S.length;
  const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const pad = (n) => String(n).padStart(2, '0');
  const icon = (kind, name) => kind === 'brand'
    ? `<svg class="bi" viewBox="0 0 24 24" aria-hidden="true">${I.brand[name]}</svg>`
    : `<svg class="li" viewBox="0 0 24 24" aria-hidden="true">${I.line[name]}</svg>`;
  const foot = (i, left) => `<footer class="foot"><span>${esc(left || window.HANDLE)}</span><span class="pg">${pad(i + 1)} / ${pad(total)}${i < total - 1 ? icon('line', 'arrow-right') : ''}</span></footer>`;
  const days = S.filter((s) => s.type === 'day');

  const T = {
    cover: (s, i) => {
      const shadows = ['--ill-c2', '--ill-c1', '--ill-c4', '--ill-c3', '--ill-c5', '--ill-c2', '--ill-c4', '--ill-c1'];
      const rot = [-4, 3, -2, 4, 2, -3, 3, -2];
      const tiles = days.map((d, k) => `
        <div class="tile" style="--r:${rot[k % rot.length]}deg;--shadow:var(${shadows[k % shadows.length]})">
          <span class="tile-d">${esc(d.day)}</span>
          <div class="tile-b">${icon('line', d.icon)}<span class="tile-n">${esc(d.n)}</span></div>
        </div>`).join('');
      return `<section class="slide cover" data-key="cover">
        <div class="eye">${esc(s.eyebrow)}</div>
        <h1 class="cover-title">${esc(s.title[0])}<br>${s.title[1].split(' ').map((w, k) => k ? esc(w) : `<em>${esc(w)}</em>`).join(' ')}</h1>
        <p class="cover-sub">${esc(s.sub)}</p>
        <div class="tiles">${tiles}</div>
        ${foot(i, window.HANDLE)}
      </section>`;
    },
    overview: (s, i) => `<section class="slide overview" data-key="overview">
        <div class="eye">${esc(s.eyebrow)}</div>
        <h2 class="ov-title">${esc(s.title)}</h2>
        <ol class="ov-list">${days.map((d) => `
          <li><div class="ov-when">${esc(d.when)}</div><div><div class="ov-t">${esc(d.title)}</div><div class="ov-w">${esc(d.what)}</div></div></li>`).join('')}
        </ol>
        ${foot(i)}
      </section>`,
    day: (s, i) => `<section class="slide day" data-key="${esc(s.key)}" style="--band:var(--band-${s.band})">
        <header class="day-head">
          <div class="cal" aria-hidden="true"><span class="cal-d">${esc(s.day)}</span><span class="cal-n">${esc(s.n)}</span></div>
          <div><div class="eye">${esc(s.when)}</div><h2 class="title">${esc(s.title)}</h2></div>
        </header>
        <figure class="art">${window.ILL[s.key] || ''}</figure>
        <p class="body">${esc(s.body)}</p>
        ${s.note ? `<div class="note">${icon('line', s.note.icon)}<div><span class="nb">${esc(s.note.label)}</span>${esc(s.note.text)}</div></div>` : ''}
        ${s.quote ? `<p class="pull">“${esc(s.quote)}”</p>` : ''}
        <div class="how">
          <div class="sec">
            <div class="lbl">Run it</div>
            <div class="run">
              <div><span class="tag">Ask</span><span class="q">“${esc(s.ask)}”</span></div>
              ${s.cmd ? `<div><span class="tag">${esc(s.cmdLabel || 'or type')}</span><code>${esc(s.cmd)}</code></div>` : ''}
            </div>
          </div>
          <div class="sec">
            <div class="lbl">${esc(s.toolsLabel || 'Works with')}</div>
            <div class="pills">${s.tools.map(([k, n, label]) => `<span class="pill">${icon(k, n)}${esc(label)}</span>`).join('')}</div>
          </div>
        </div>
        ${s.fine ? `<p class="fine">${esc(s.fine)}</p>` : ''}
        ${foot(i)}
      </section>`,
    closing: (s, i) => `<section class="slide closing" data-key="closing">
        <div class="cl-top">${icon('line', 'shield-check')}<span class="nb">${esc(s.label)}</span></div>
        <h2 class="cl-title">${esc(s.title[0])}<br>${esc(s.title[1])}</h2>
        <p class="cl-body">${esc(s.body)}</p>
        <div class="itqan"><span class="ar" lang="ar" dir="rtl">${esc(s.arabic)}</span><span class="itqan-en">${esc(s.itqan)}</span></div>
        <div class="cta"><span class="cta-pill">${esc(s.cta)}</span><span class="cta-text">${esc(s.ctaText)}</span></div>
        ${foot(i, s.foot)}
      </section>`,
  };

  document.getElementById('deck').innerHTML = S.map((s, i) => T[s.type](s, i)).join('');
  document.fonts.ready.then(() => { document.body.dataset.ready = '1'; });
})();
</script>
</body>
</html>
