name: Visibility check

# Crawls shareefi.co, itqanstudio.com and projectyou.app as Googlebot,
# Bingbot and the OpenAI, Anthropic and Perplexity crawlers, and fails when
# something would block or mislead them. See scripts/visibility-check.mjs.
on:
  schedule:
    - cron: "17 5 * * *" # daily, 09:17 in Dubai
  workflow_dispatch:
    inputs:
      submit_indexnow:
        description: "Also submit every sitemap URL to IndexNow (Bing, Yandex, Seznam, Naver, Yep). Use after a deploy that changed content."
        type: boolean
        default: false
  push:
    paths:
      - ".github/workflows/visibility-check.yml"
      - "scripts/visibility-check.mjs"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # 10s per request, one after another: a wedged site costs about a minute
    # (it is skipped once every home fetch fails), a slow one a few minutes.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Crawl the live sites the way search and AI crawlers do
        run: node scripts/visibility-check.mjs
        env:
          SUBMIT_INDEXNOW: ${{ inputs.submit_indexnow && 'true' || 'false' }}

  keepalive:
    # GitHub disables the schedule of a public repo after 60 days without a
    # commit, silently: no failed run, no email. Re-enabling the workflow
    # through the API resets that clock without a dummy commit. Only this job
    # gets actions: write; the check job keeps contents: read.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Reset the 60-day inactivity clock
        run: gh api --method PUT "repos/${{ github.repository }}/actions/workflows/visibility-check.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
